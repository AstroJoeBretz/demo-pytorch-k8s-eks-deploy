# KServe's controller starts torchserve with:
#   --model-store=/mnt/models/model-store
#   --ts-config=/mnt/models/config/config.properties
# (confirmed directly from KServe's source - predictor_torchserve.go)
# so this file's paths below are not arbitrary - they must match that
# mount point exactly.
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082
number_of_netty_threads=4
job_queue_size=10
model_store=/mnt/models/model-store
model_snapshot={"name":"startup.cfg","modelCount":1,"models":{"pytorch-toy-classifier":{"1.0":{"defaultVersion":true,"marName":"pytorch-toy-classifier.mar","minWorkers":1,"maxWorkers":3,"batchSize":1,"maxBatchDelay":100,"responseTimeout":120}}}}
