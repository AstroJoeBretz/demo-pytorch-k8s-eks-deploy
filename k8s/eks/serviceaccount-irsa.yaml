# Same ServiceAccount from step 3's rbac.yaml, with one new annotation.
# Everything RBAC granted it (the Role/RoleBinding from step 3) still
# applies unchanged - this ADDS AWS permissions, it doesn't replace
# anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server-sa
  namespace: ml-serving
  annotations:
    # This is the entire bridge between Kubernetes RBAC and AWS IAM.
    # eksctl create iamserviceaccount writes this annotation for you -
    # replace ACCOUNT_ID with your real account ID once you've created
    # the role.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/model-server-s3-reader
